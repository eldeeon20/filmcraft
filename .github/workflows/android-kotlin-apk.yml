name: android-kotlin-apk

# Builds the APK with the original egui UI plus Kotlin support. It never compiles Rust:
# libfilmcraft_android.so comes prebuilt from Release android-core-v1.

on:
  push:
    branches:
      - android-kotlin
    paths:
      - "apps/filmcraft-android/android/**"
      - ".github/workflows/android-kotlin-apk.yml"
    tags:
      - "apk-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP: apps/filmcraft-android/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure the Android SDK and platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Download the prebuilt core (Release android-core-v1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$APP/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$dir"
          gh release download android-core-v1 -D "$dir" --clobber
          ls -l "$dir"
          test -f "$dir/libfilmcraft_android.so"
      - name: Build the APK (release)
        working-directory: ${{ env.APP }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/filmcraft-ci.keystore" \
            -storepass filmcraft-ci -keypass filmcraft-ci -alias filmcraft-ci \
            -dname "CN=FilmCraft CI, O=FilmCraft, C=US" -keyalg RSA -keysize 2048 -validity 10000
          gradle assembleRelease -PfilmcraftStoreFile="$RUNNER_TEMP/filmcraft-ci.keystore" --no-daemon
        env:
          FILMCRAFT_KEYSTORE_PASSWORD: filmcraft-ci
          FILMCRAFT_KEY_ALIAS: filmcraft-ci
          FILMCRAFT_KEY_PASSWORD: filmcraft-ci
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-android-kotlin-arm64-apk
          path: ${{ env.APP }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
